[package]
name = "rfb_labs_week_6"
version = "0.1.0"
edition = "2021"

[dependencies]
# Bitcoin and cryptography
bitcoin = "0.29"
secp256k1 = { version = "0.27", features = ["recovery", "rand-std"] }

# Wallet management
bdk = "0.28"

# Bitcoin Core RPC
bitcoincore-rpc = "0.17"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
dotenv = "0.15"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Utilities
hex = "0.4"
rand = "0.8"
