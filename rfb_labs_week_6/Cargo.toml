[package]
name = "rfb_labs_week_6"
version = "0.1.0"
edition = "2024"
description = "Regtest Bitcoin wallet: BDK for wallet logic, bitcoincore-rpc for node I/O, rust-bitcoin for raw primitives"

[[bin]]
name = "rfbwallet"
path = "src/main.rs"

[lib]
name = "rfb_labs_week_6"
path = "src/lib.rs"

[dependencies]
bdk_wallet = { version = "3.1", features = ["rusqlite", "keys-bip39"] }
bdk_bitcoind_rpc = "0.22"
bitcoincore-rpc = "0.19"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
