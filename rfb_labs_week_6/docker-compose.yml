services:
  bitcoind:
    image: polarlightning/bitcoind:30.0
    container_name: rfb-week6-bitcoind
    command:
      - bitcoind
      - -regtest=1
      - -server=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=rfbuser
      - -rpcpassword=rfbpass
      - -rpcport=18443
      - -txindex=1
      - -fallbackfee=0.0001
    ports:
      - "18443:18443"
      - "18444:18444"
