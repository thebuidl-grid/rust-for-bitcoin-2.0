[package]
name = "serializetrx"
version = "0.1.0"
edition = "2024"
description = "Builds and serializes a Bitcoin transaction from command-line values"

[[bin]]
name = "serializetrx"
path = "src/main.rs"

[lib]
name = "serializetrx"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
