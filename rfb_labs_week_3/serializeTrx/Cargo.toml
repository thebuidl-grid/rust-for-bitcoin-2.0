[package]
name = "serializetrx"
version = "0.1.0"
edition = "2024"
description = "Serialise a Bitcoin transaction from values supplied on the command line"

[[bin]]
name = "serializetrx"
path = "src/main.rs"

[lib]
name = "serializetrx"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
