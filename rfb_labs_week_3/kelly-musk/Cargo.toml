[package]
name = "week3-txdecode"
version = "0.1.0"
edition = "2021"
authors = ["kelly-musk"]
description = "Week 3 — from-scratch raw Bitcoin transaction parser and decoder (legacy + SegWit)"
license = "MIT"
publish = false

[[bin]]
name = "txdecode"
path = "src/main.rs"

[lib]
name = "week3_txdecode"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
