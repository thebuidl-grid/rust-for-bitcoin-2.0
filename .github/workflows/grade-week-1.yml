name: Grade Week 1 Labs

on:
  push:
    branches:
      - main
      - rfb_labs_week_1
    paths:
      - "rfb_labs_week_1/**"
      - ".github/workflows/grade-week-1.yml"

  pull_request:
    branches:
      - main
    paths:
      - "rfb_labs_week_1/**"
      - ".github/workflows/grade-week-1.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week-1-grading-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grade:
    name: Score ten practical labs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out submission
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected assessment files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin main --depth=1
            base_sha="$(git merge-base origin/main HEAD)"
          fi

          changed_files="$(git diff --name-only "$base_sha" HEAD | grep '^rfb_labs_week_1/' || true)"

          allowed_pattern='^(rfb_labs_week_1/src/labs/lab[0-9]{2}_[^/]+\.rs|rfb_labs_week_1/src/main\.rs|rfb_labs_week_1/examples/.*|rfb_labs_week_1/submissions/lab_[0-9]{2}\.md|rfb_labs_week_1/submissions/evidence/.*)$'

          disallowed_files="$(
            printf '%s\n' "$changed_files" |
              grep -Ev "$allowed_pattern" || true
          )"

          if [[ -n "$disallowed_files" ]]; then
            echo "::error title=Protected files modified::Only lab implementations, submission evidence, and optional example programs may be changed."
            echo
            echo "Disallowed changes:"
            printf '%s\n' "$disallowed_files"
            exit 1
          fi

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        working-directory: rfb_labs_week_1
        run: cargo fmt --check
        continue-on-error: true

      - name: Grade lab tests and evidence
        working-directory: rfb_labs_week_1
        run: bash grader/grade.sh

      - name: Publish score summary
        if: always()
        run: |
          if [ -f rfb_labs_week_1/grading/score.md ]; then
            cat rfb_labs_week_1/grading/score.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload grading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfb-week-1-score-${{ github.run_id }}
          path: |
            rfb_labs_week_1/grading/score.md
            rfb_labs_week_1/grading/score.json
            rfb_labs_week_1/grading/logs/
          if-no-files-found: warn
          retention-days: 30