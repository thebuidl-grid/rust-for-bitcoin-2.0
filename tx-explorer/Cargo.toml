[package]
name = "tx-explorer"
version = "0.1.0"
edition = "2021"
authors = ["akshola00"]
description = "Bitcoin Transaction Explorer — decode, analyze and inspect any transaction field by field"
license = "MIT"

[[bin]]
name = "txexp"
path = "src/main.rs"

[lib]
name = "tx_explorer"
path = "src/lib.rs"

[dependencies]
bitcoin = { version = "0.32", features = ["serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
owo-colors = "4"
dotenvy = "0.15"
bitcoincore-rpc = "0.19"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ureq = "2"

[dev-dependencies]
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }
