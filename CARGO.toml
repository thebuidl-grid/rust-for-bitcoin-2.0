[package]
name = "btc_tx_serializer"
version = "0.1.0"
edition = "2021"
description = "Construct and serialize Bitcoin transactions from command-line arguments"

[[bin]]
name = "btc_tx_serializer"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
thiserror = "1.0"

[profile.release]
opt-level = 3